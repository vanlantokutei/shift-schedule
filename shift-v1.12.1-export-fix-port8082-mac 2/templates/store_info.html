<dialog id="storeInfoDialog" class="store-info-dialog" aria-labelledby="storeInfoTitle">
 <form method="dialog" class="store-info-close-form"><button type="submit" class="store-info-close" aria-label="Đóng">×</button></form>
 <p class="store-info-label">Thông tin quán</p>
 <h2 id="storeInfoTitle" lang="ja">ベト屋築地店</h2>
 <p class="store-info-name">BETOYA Tsukiji</p>
 <dl class="store-info-details">
  <div><dt>Địa chỉ / 住所</dt><dd lang="ja">〒104-0045<br>東京都中央区築地3-11-6 1階</dd></div>
  <div><dt>Điện thoại / 電話</dt><dd><a href="tel:0362641370">03-6264-1370</a></dd></div>
  <div><dt>Giờ mở cửa / 営業時間</dt><dd>08:30–22:00<small>Gọi món cuối / L.O. 21:30</small></dd></div>
  <div><dt>Đường đến quán / アクセス</dt><dd>Ga Tsukiji, cửa số 1 · đi bộ 1 phút</dd></div>
 </dl>
 <a class="store-info-map" href="https://www.google.com/maps/place/%E3%83%99%E3%83%88%E5%B1%8B%2B%E7%AF%89%E5%9C%B0%E5%BA%97/@35.6676442,139.7697428,17z/data=!3m2!4b1!5s0x60188bdf79817129:0xc5003b02df63090d!4m6!3m5!1s0x60188b859493152f:0x98b3b7a934a0a278!8m2!3d35.6676442!4d139.7723177!16s%2Fg%2F11q7w8006k?entry=ttu&amp;hl=en" target="_blank" rel="noopener noreferrer">Mở Google Maps ↗</a>
 <a class="store-info-website" href="https://betoya.jp/store/tsukiji/" target="_blank" rel="noopener noreferrer">Website chính thức ↗</a>
</dialog>
<script>
(()=>{
 const dialog=document.getElementById('storeInfoDialog');
 document.querySelectorAll('.store-info-trigger').forEach(button=>{
  button.addEventListener('click',()=>{if(!dialog.open)dialog.showModal()});
 });
 dialog.addEventListener('click',event=>{
  if(event.target!==dialog)return;
  const rect=dialog.getBoundingClientRect();
  if(event.clientX<rect.left||event.clientX>rect.right||event.clientY<rect.top||event.clientY>rect.bottom)dialog.close();
 });
})();
</script>
