<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cài đặt</title><link rel="stylesheet" href="/static/style.css"></head><body><header><div><b>⚙️ CÀI ĐẶT</b><span>Tùy chỉnh V1</span></div><a href="/">← Lịch</a></header><main class="settings"><section><h2>Hoạt động</h2><form method="post"><input type="hidden" name="action" value="settings"><label>Mở cửa<input type="time" name="open" value="{{st.open}}"></label><label>Đóng cửa<input type="time" name="close" value="{{st.close}}"></label><label>Số người tối thiểu<input type="number" name="min_staff" min="1" value="{{st.min_staff}}"></label><button class="primary">Lưu cài đặt</button></form></section><section><h2>Nhân viên</h2><form method="post" class="add"><input type="hidden" name="action" value="add_staff"><input name="name" placeholder="Tên nhân viên" required><button class="primary">＋ Thêm</button></form><div class="stafflist">{% for s in staff %}<div><b>{{s.name}}</b><form method="post"><input type="hidden" name="action" value="delete_staff"><input type="hidden" name="id" value="{{s.id}}"><button>Ẩn</button></form></div>{% endfor %}</div></section></main></body></html>
